version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cureflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/CureFlow.Api/Dockerfile
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=cureflow;Username=postgres;Password=postgres;GSS Encryption Mode=Disable"
      Jwt__Secret: "${JWT_SECRET:-replace-with-64-char-random-secret-for-local-docker}"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY}"
      # WhatsApp credentials are configured per-tenant at runtime (Settings → Integrations).
      Database__Seed: "true"
    ports:
      - "5180:8080"

volumes:
  pgdata:
