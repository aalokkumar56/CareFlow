<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none" role="img" aria-label="CureFlow design system reference">
  <rect width="720" height="520" fill="#FDFDFC"/>
  <text x="32" y="40" font-family="Outfit, system-ui, sans-serif" font-size="24" font-weight="700" fill="#022C22">CureFlow Design System</text>
  <text x="32" y="62" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#4B5563">Organic &amp; Earthy &#183; Light theme &#183; SVG reference</text>

  <!-- Colors -->
  <text x="32" y="96" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#022C22">Colors</text>
  <rect x="32" y="108" width="72" height="48" rx="6" fill="#064E3B"/>
  <text x="32" y="170" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">Primary #064E3B</text>
  <rect x="116" y="108" width="72" height="48" rx="6" fill="#022C22"/>
  <text x="116" y="170" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">Deep #022C22</text>
  <rect x="200" y="108" width="72" height="48" rx="6" fill="#4338CA"/>
  <text x="200" y="170" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">Accent #4338CA</text>
  <rect x="284" y="108" width="72" height="48" rx="6" fill="#FDFDFC" stroke="#E5E7EB"/>
  <text x="284" y="170" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">BG #FDFDFC</text>
  <rect x="368" y="108" width="72" height="48" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="368" y="170" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">Surface</text>
  <rect x="452" y="108" width="72" height="48" rx="6" fill="#4B5563"/>
  <text x="452" y="170" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">Secondary text</text>
  <rect x="536" y="108" width="72" height="48" rx="6" fill="#16A34A"/>
  <text x="536" y="170" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">WhatsApp</text>

  <!-- Typography -->
  <text x="32" y="210" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#022C22">Typography</text>
  <text x="32" y="238" font-family="Outfit, sans-serif" font-size="28" font-weight="600" fill="#022C22">Heading &#8212; Outfit 28px</text>
  <text x="32" y="268" font-family="Outfit, sans-serif" font-size="20" font-weight="600" fill="#022C22">H2 &#8212; Outfit 20px</text>
  <text x="32" y="296" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#4B5563">Body &#8212; IBM Plex Sans 16px, line-height 1.5</text>
  <text x="32" y="320" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#4B5563">UI base &#8212; 13px minimum for dense tables</text>
  <text x="32" y="342" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#9CA3AF">Caption / muted &#8212; use sparingly</text>

  <!-- Buttons -->
  <text x="32" y="382" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#022C22">Buttons</text>
  <rect x="32" y="394" width="120" height="36" rx="12" fill="#064E3B"/>
  <text x="52" y="417" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">Primary</text>
  <rect x="164" y="394" width="120" height="36" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="188" y="417" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#111827">Secondary</text>
  <rect x="296" y="394" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="318" y="417" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#064E3B">Sharp sm</text>

  <!-- Border radius -->
  <text x="32" y="462" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#022C22">Border radius</text>
  <rect x="32" y="474" width="56" height="36" rx="4" fill="#fff" stroke="#E5E7EB"/>
  <text x="40" y="530" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">rounded-sm</text>
  <rect x="100" y="474" width="56" height="36" rx="12" fill="#fff" stroke="#E5E7EB"/>
  <text x="108" y="530" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">rounded-xl</text>
  <rect x="168" y="474" width="56" height="36" rx="18" fill="#fff" stroke="#E5E7EB"/>
  <text x="172" y="530" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4B5563">rounded-2xl</text>

  <!-- Focus ring demo -->
  <rect x="400" y="394" width="140" height="36" rx="12" fill="#fff" stroke="#064E3B" stroke-width="2"/>
  <rect x="398" y="392" width="144" height="40" rx="14" stroke="#064E3B" stroke-width="2" opacity="0.25" fill="none"/>
  <text x="418" y="417" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#022C22">Focus ring</text>
</svg>
